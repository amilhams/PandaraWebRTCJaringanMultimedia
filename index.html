<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Video Call</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
        }

        .info-panel {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .id-highlight {
            color: #00ffcc;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .input-group {
            margin-top: 15px;
        }

        input {
            padding: 10px;
            width: 60%;
            border-radius: 5px;
        }

        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .video-wrapper {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .video-box {
            flex: 1;
            min-width: 300px;
        }

        video {
            width: 100%;
            background-color: #000;
            border-radius: 10px;
            border: 2px solid #444;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>WebRTC Video Call</h2>

        <div class="info-panel">
            <p>ID Perangkat Anda:</p>
            <div class="id-highlight" id="my-id">Memuat ID...</div>

            <div class="input-group">
                <input type="text" id="remote-id" placeholder="Masukkan ID teman">
                <button id="call-btn">Panggil</button>
            </div>
            <p id="status-koneksi" style="color: yellow; font-size: 14px; margin-top:-2;"></p>
        </div>

        <div class="video-wrapper">
            <div class="video-box">
                <h3>Kamera Anda</h3>
                <video id="local-video" autoplay playsinline muted></video>
            </div>
            <div class="video-box">
                <h3>Kamera Teman</h3>
                <video id="remote-video" autoplay playsinline></video>
            </div>
        </div>
    </div>

    <script>
        const localVideo = document.getElementById('local-video');
        const remoteVideo = document.getElementById('remote-video');
        const myIdElement = document.getElementById('my-id');
        const remoteIdInput = document.getElementById('remote-id');
        const callBtn = document.getElementById('call-btn');
        const statusKoneksi = document.getElementById('status-koneksi');

        let localStream = null;

        // 1. Menyalakan Kamera
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(stream => {
                localStream = stream;
                localVideo.srcObject = stream;
                statusKoneksi.innerText = "Kamera & Mikrofon siap!";
            })
            .catch(error => {
                alert("Gagal mengakses kamera/mikrofon. Pastikan Anda sudah memberikan izin.");
                statusKoneksi.innerText = "Error: Kamera diblokir.";
            });

        // 2. Inisialisasi PeerJS
        const peer = new Peer();

        peer.on('open', id => {
            myIdElement.innerText = id;
        });

        // 3. Menangani Error PeerJS (PENTING)
        peer.on('error', err => {
            console.error(err);
            alert("Terjadi Error: " + err.type + "\n" + err.message);
            statusKoneksi.innerText = "Gagal memanggil. Cek Pop-up Error.";
        });

        // 4. Logika Menerima Panggilan
        peer.on('call', call => {
            const angkat = confirm("Ada panggilan masuk! Angkat?");
            if (angkat) {
                call.answer(localStream);
                call.on('stream', remoteStream => {
                    remoteVideo.srcObject = remoteStream;
                    // Baris di bawah ini wajib ada untuk memaksa video berputar di HP
                    remoteVideo.play().catch(e => console.log("Gagal putar otomatis:", e));
                });
            }
        });

        // 5. Logika Melakukan Panggilan
        callBtn.addEventListener('click', () => {
            const remoteId = remoteIdInput.value.trim();
            if (!remoteId) return;

            const call = peer.call(remoteId, localStream);
            call.on('stream', remoteStream => {
                remoteVideo.srcObject = remoteStream;
                // Wajib ada juga di sini
                remoteVideo.play().catch(e => console.log("Gagal putar otomatis:", e));
            });
        });
    </script>
</body>

</html>
