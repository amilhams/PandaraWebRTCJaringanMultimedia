<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Video Call WebRTC</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            text-align: center;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
        }

        h2 {
            margin-top: 0;
            color: #38bdf8;
            font-size: 28px;
            letter-spacing: 0.5px;
        }

        .info-panel {
            background: #0f172a;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid #334155;
        }

        .id-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 10px 0 15px;
            flex-wrap: wrap;
        }

        .id-highlight {
            color: #38bdf8;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 1.5px;
            background: #1e293b;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px dashed #38bdf8;
            user-select: all;
        }

        .btn-copy {
            background-color: #334155;
            color: #f8fafc;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: background-color 0.2s;
        }

        .btn-copy:hover {
            background-color: #475569;
        }

        .input-group {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        input {
            padding: 12px 16px;
            width: 320px;
            max-width: 100%;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #1e293b;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #38bdf8;
        }

        button.btn-primary {
            padding: 12px 24px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            transition: background-color 0.2s, transform 0.1s;
        }

        button.btn-primary:hover {
            background-color: #0369a1;
        }

        button.btn-primary:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }

        button.btn-danger {
            padding: 12px 24px;
            background-color: #e11d48;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            display: none;
            transition: background-color 0.2s;
        }

        button.btn-danger:hover {
            background-color: #be123c;
        }

        #status-koneksi {
            font-weight: 500;
            font-size: 14px;
            margin-top: 12px;
            min-height: 20px;
        }

        .video-wrapper {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .video-box {
            flex: 1;
            min-width: 280px;
            background: #0f172a;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #334155;
            position: relative;
        }

        .video-box h3 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 16px;
            color: #94a3b8;
        }

        video {
            width: 100%;
            height: 240px;
            background-color: #000;
            border-radius: 8px;
            object-fit: cover;
        }

        .play-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.85);
            border-radius: 12px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #38bdf8;
            font-weight: 600;
            cursor: pointer;
            z-index: 10;
            padding: 20px;
            backdrop-filter: blur(4px);
        }

        .play-overlay span.play-icon {
            font-size: 48px;
            margin-bottom: 8px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>WebRTC Video Call</h2>

        <div class="info-panel">
            <p style="margin:0; color:#94a3b8; font-size:14px;">ID Perangkat Anda:</p>
            <div class="id-container">
                <span class="id-highlight" id="my-id">Memuat ID...</span>
                <button class="btn-copy" id="copy-btn" title="Salin ID ke Clipboard">📋 Salin</button>
            </div>

            <div class="input-group">
                <input type="text" id="remote-id" placeholder="Masukkan ID teman">
                <button class="btn-primary" id="call-btn">Panggil</button>
                <button class="btn-danger" id="hangup-btn">Tutup Panggilan</button>
            </div>
            <p id="status-koneksi" style="color: #facc15;"></p>
        </div>

        <div class="video-wrapper">
            <div class="video-box">
                <h3>Kamera Anda</h3>
                <video id="local-video" autoplay playsinline muted></video>
            </div>
            <div class="video-box" id="remote-box">
                <h3>Kamera Teman</h3>
                <video id="remote-video" autoplay playsinline></video>
                <div class="play-overlay" id="play-overlay">
                    <span class="play-icon">▶</span>
                    <span>Klik Di Sini Untuk Memutar Video Teman</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const localVideo = document.getElementById('local-video');
        const remoteVideo = document.getElementById('remote-video');
        const remoteBox = document.getElementById('remote-box');
        const playOverlay = document.getElementById('play-overlay');
        const myIdElement = document.getElementById('my-id');
        const remoteIdInput = document.getElementById('remote-id');
        const callBtn = document.getElementById('call-btn');
        const hangupBtn = document.getElementById('hangup-btn');
        const copyBtn = document.getElementById('copy-btn');
        const statusKoneksi = document.getElementById('status-koneksi');

        let localStream = null;
        let currentCall = null;
        let currentDataConn = null;

        // Update status visual & log diagnosis
        function setStatus(msg, type = 'info') {
            statusKoneksi.innerText = msg;
            if (type === 'error') statusKoneksi.style.color = '#f87171';
            else if (type === 'success') statusKoneksi.style.color = '#4ade80';
            else statusKoneksi.style.color = '#facc15';
        }

        function logDiag(msg, type = 'info') {
            const time = new Date().toLocaleTimeString();
            console.log(`[${time}] [${type.toUpperCase()}] ${msg}`);
        }

        setStatus("Mengakses kamera & mikrofon...");
        logDiag("Meminta izin akses Kamera & Mikrofon...");

        // 1. Menyalakan Kamera & Mikrofon
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(stream => {
                localStream = stream;
                localVideo.srcObject = stream;
                setStatus("Kamera & Mikrofon siap! Menghubungkan ke server PeerJS...");
                initPeer();
            })
            .catch(error => {
                console.error("Gagal getMedia:", error);
                alert("Gagal mengakses kamera/mikrofon. Harap berikan izin pada browser Anda.");
                setStatus("Error: Akses Kamera/Mikrofon Ditolak!", 'error');
            });

        // 2. Inisialisasi PeerJS dengan STUN Server Handal
        let peer = null;

        function initPeer() {
            peer = new Peer({
                config: {
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' },
                        { urls: 'stun:stun2.l.google.com:19302' },
                        { urls: 'stun:stun3.l.google.com:19302' },
                        { urls: 'stun:stun4.l.google.com:19302' },
                        { urls: 'stun:stun.services.mozilla.com' },
                        { urls: 'stun:stun.stunprotocol.org:3478' }
                    ]
                }
            });

            peer.on('open', id => {
                myIdElement.innerText = id;
                setStatus("Siap melakukan atau menerima panggilan.", 'success');
                logDiag("PeerJS ID Berhasil Didapatkan: " + id);
            });

            // Handle incoming Data Connection (Sinkronisasi Tutup Panggilan)
            peer.on('connection', conn => {
                logDiag("Koneksi data kontrol diterima dari: " + conn.peer);
                setupDataConnection(conn);
            });

            // 3. Menangani Error PeerJS
            peer.on('error', err => {
                console.error("PeerJS Error:", err);
                logDiag("PeerJS Error: " + err.type + " - " + err.message, 'error');
                if (err.type === 'peer-unavailable') {
                    setStatus("ID Teman tidak ditemukan atau tidak aktif!", 'error');
                    alert("Panggilan Gagal: ID Teman tidak ditemukan atau tidak online.");
                } else if (err.type === 'unavailable-id') {
                    setStatus("ID sudah digunakan oleh sesi lain.", 'error');
                } else {
                    setStatus("Error Koneksi: " + err.type, 'error');
                }
                endCall(false);
            });

            // 4. Logika Menerima Panggilan
            peer.on('call', call => {
                logDiag("Panggilan masuk dari ID: " + call.peer);
                if (!localStream) {
                    alert("Kamera Anda belum siap.");
                    return;
                }

                const angkat = confirm("Ada panggilan masuk dari " + call.peer + "! Angkat panggilan?");
                if (angkat) {
                    if (currentCall) endCall(false);

                    currentCall = call;
                    call.answer(localStream);
                    setupCallListeners(call);
                } else {
                    logDiag("Panggilan ditolak oleh pengguna lokal.");
                }
            });
        }

        // 5. Logika Melakukan Panggilan
        callBtn.addEventListener('click', () => {
            const remoteId = remoteIdInput.value.trim();
            if (!remoteId) {
                alert("Masukkan ID teman terlebih dahulu!");
                return;
            }

            if (!localStream) {
                alert("Kamera belum siap. Harap izinkan akses kamera & mikrofon.");
                return;
            }

            if (remoteId === myIdElement.innerText) {
                alert("Anda tidak dapat memanggil ID Anda sendiri!");
                return;
            }

            setStatus("Memanggil " + remoteId + "...", 'info');
            logDiag("Mencoba memanggil ID Teman: " + remoteId);
            callBtn.disabled = true;

            if (currentCall) endCall(false);

            // Buka Data Connection untuk sinyal kontrol (hangup)
            const conn = peer.connect(remoteId);
            setupDataConnection(conn);

            // Buka Media Call
            const call = peer.call(remoteId, localStream);
            currentCall = call;
            setupCallListeners(call);
        });

        // Sinkronisasi Sinyal Data (Hangup)
        function setupDataConnection(conn) {
            currentDataConn = conn;
            conn.on('data', data => {
                logDiag("Sinyal kontrol diterima: " + JSON.stringify(data));
                if (data && data.type === 'hangup') {
                    setStatus("Panggilan diakhiri oleh teman.", 'info');
                    endCall(false);
                }
            });
            conn.on('close', () => {
                logDiag("Data connection ditutup.");
                endCall(false);
            });
        }

        // Handler terpusat untuk alur panggilan
        function setupCallListeners(call) {
            showCallActiveUI();
            setStatus("Menghubungkan media (Mencari Jalur P2P)...", 'info');
            logDiag("Memulai sesi WebRTC RTCPeerConnection...");

            call.on('stream', remoteStream => {
                logDiag("Remote media stream diterima dari teman!");
                remoteVideo.srcObject = remoteStream;

                remoteVideo.onloadedmetadata = () => {
                    playRemoteVideo();
                };
                playRemoteVideo();
            });

            // Pantau status WebRTC P2P
            if (call.peerConnection) {
                const pc = call.peerConnection;

                pc.onicecandidate = event => {
                    if (event.candidate) {
                        logDiag("Kandidat Jalur (ICE Candidate) ditemukan: " + event.candidate.type);
                    }
                };

                pc.oniceconnectionstatechange = () => {
                    const state = pc.iceConnectionState;
                    logDiag("Status Jaringan P2P (ICE State): " + state);

                    if (state === 'connected' || state === 'completed') {
                        setStatus("Panggilan terhubung! Video & Audio aktif.", 'success');
                        playRemoteVideo();
                    } else if (state === 'checking') {
                        setStatus("Sedang memverifikasi jalur P2P / STUN...", 'info');
                    } else if (state === 'failed') {
                        setStatus("Gagal terhubung ke teman. Pastikan kedua perangkat terhubung ke internet.", 'error');
                        logDiag("Koneksi P2P Gagal (ICE Failed).", 'error');
                    } else if (state === 'disconnected' || state === 'closed') {
                        setStatus("Koneksi P2P terputus.", 'error');
                        logDiag("Koneksi P2P terputus.", 'error');
                    }
                };
            }

            call.on('close', () => {
                setStatus("Panggilan telah diakhiri.", 'info');
                endCall(false);
            });

            call.on('error', err => {
                console.error("Call error:", err);
                setStatus("Terjadi kesalahan pada panggilan.", 'error');
                endCall(false);
            });
        }

        // Memutar video teman & mengontrol overlay
        function playRemoteVideo() {
            if (!remoteVideo.srcObject) return;

            remoteVideo.play()
                .then(() => {
                    hidePlayOverlay();
                    setStatus("Panggilan terhubung! Video & Audio aktif.", 'success');
                })
                .catch(e => {
                    console.warn("Autoplay terblokir oleh browser:", e);
                    showPlayOverlay();
                    setStatus("Klik tombol '▶' pada kotak kamera teman untuk memutar video!", 'info');
                });
        }

        function showPlayOverlay() {
            playOverlay.style.display = 'flex';
        }

        function hidePlayOverlay() {
            playOverlay.style.display = 'none';
        }

        // Event listener klik pada area video teman dan overlay
        [remoteBox, playOverlay, remoteVideo].forEach(elem => {
            if (elem) {
                elem.addEventListener('click', () => {
                    if (remoteVideo.srcObject) {
                        playRemoteVideo();
                    }
                });
            }
        });

        // 6. Logika Menutup Panggilan (Hang Up)
        hangupBtn.addEventListener('click', () => {
            setStatus("Panggilan diakhiri.", 'info');
            endCall(true);
        });

        function endCall(sendSignal = true) {
            if (sendSignal && currentDataConn) {
                try {
                    currentDataConn.send({ type: 'hangup' });
                } catch (e) {
                    console.error("Error sending hangup signal:", e);
                }
            }

            if (currentCall) {
                try { currentCall.close(); } catch (e) {}
                currentCall = null;
            }

            if (currentDataConn) {
                try { currentDataConn.close(); } catch (e) {}
                currentDataConn = null;
            }

            hidePlayOverlay();
            resetCallUI();
        }

        // 7. Utility UI
        function showCallActiveUI() {
            callBtn.style.display = 'none';
            hangupBtn.style.display = 'inline-block';
            remoteIdInput.disabled = true;
        }

        function resetCallUI() {
            callBtn.style.display = 'inline-block';
            callBtn.disabled = false;
            hangupBtn.style.display = 'none';
            remoteIdInput.disabled = false;
            remoteVideo.srcObject = null;
            currentCall = null;
            hidePlayOverlay();
        }

        // Copy ID Button
        copyBtn.addEventListener('click', () => {
            const idText = myIdElement.innerText;
            if (idText && idText !== 'Memuat ID...') {
                navigator.clipboard.writeText(idText).then(() => {
                    copyBtn.innerText = "✓ Tersalin!";
                    setTimeout(() => copyBtn.innerText = "📋 Salin", 2000);
                }).catch(err => {
                    console.error("Gagal menyalin:", err);
                });
            }
        });
    </script>
</body>

</html>
