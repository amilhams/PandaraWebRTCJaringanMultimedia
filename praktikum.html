<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Video Call</title>
    <!-- Memuat Library PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .info-panel {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .id-highlight {
            color: #00ffcc;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .input-group {
            margin-top: 15px;
        }
        input {
            padding: 10px;
            width: 60%;
            border: none;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #0056b3; }
        .video-wrapper {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .video-box {
            flex: 1;
            min-width: 300px;
        }
        video {
            width: 100%;
            background-color: #000;
            border-radius: 10px;
            border: 2px solid #444;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>WebRTC Video Call</h2>
        
        <!-- Panel Informasi ID -->
        <div class="info-panel">
            <p>Berikan ID ini ke teman Anda agar mereka bisa menelepon:</p>
            <div class="id-highlight" id="my-id">Memuat ID...</div>
            
            <div class="input-group">
                <input type="text" id="remote-id" placeholder="Masukkan ID teman di sini">
                <button id="call-btn">Panggil</button>
            </div>
        </div>

        <!-- Area Video -->
        <div class="video-wrapper">
            <div class="video-box">
                <h3>Kamera Anda</h3>
                <!-- muted wajib untuk video lokal agar suara tidak mantul -->
                <video id="local-video" autoplay playsinline muted></video>
            </div>
            <div class="video-box">
                <h3>Kamera Teman</h3>
                <video id="remote-video" autoplay playsinline></video>
            </div>
        </div>
    </div>

    <script>
        // Mengambil elemen HTML
        const localVideo = document.getElementById('local-video');
        const remoteVideo = document.getElementById('remote-video');
        const myIdElement = document.getElementById('my-id');
        const remoteIdInput = document.getElementById('remote-id');
        const callBtn = document.getElementById('call-btn');

        let localStream;

        // 1. Menyalakan Kamera dan Mikrofon
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
            .then(stream => {
                localStream = stream;
                localVideo.srcObject = stream;
            })
            .catch(error => {
                console.error("Gagal akses kamera:", error);
                alert("Tolong izinkan akses kamera dan mikrofon di browser Anda!");
            });

        // 2. Inisialisasi PeerJS (Terhubung ke server mak comblang)
        const peer = new Peer();

        // Saat berhasil terhubung, server akan memberikan ID unik acak
        peer.on('open', id => {
            myIdElement.innerText = id;
        });

        // 3. Logika Menjawab Panggilan (Ketika teman menelepon Anda)
        peer.on('call', call => {
            // Meminta konfirmasi angkat telepon
            const angkat = confirm("Ada panggilan masuk! Angkat?");
            if (angkat) {
                // Jawab dengan mengirimkan video/audio kita
                call.answer(localStream);
                
                // Menerima video/audio dari teman dan menampilkannya
                call.on('stream', remoteStream => {
                    remoteVideo.srcObject = remoteStream;
                });
            }
        });

        // 4. Logika Melakukan Panggilan (Ketika Anda klik tombol Panggil)
        callBtn.addEventListener('click', () => {
            const remoteId = remoteIdInput.value.trim();
            if (!remoteId) {
                alert("Masukkan ID teman terlebih dahulu!");
                return;
            }

            // Melakukan panggilan ke ID teman dengan mengirim video/audio kita
            const call = peer.call(remoteId, localStream);

            // Menerima video/audio dari teman setelah dia mengangkatnya
            call.on('stream', remoteStream => {
                remoteVideo.srcObject = remoteStream;
            });
        });
    </script>
</body>
</html>
